name: Ultra-RDP-VideoEditor

on:
  workflow_dispatch:

jobs:
  video-editing-rdp:
    runs-on: windows-latest
    timeout-minutes: 360 # 6 Hours Max

    steps:
      - name: 🚀 Optimize Windows for Video Editing
        run: |
          # 1. Performance Tweaks (Visuals OFF, Performance ON)
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name UserPreferencesMask -Value ([byte[]](144,18,3,128))
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name VisualFXSetting -Value 2
          
          # 2. Enable Audio (Sound Service) for CapCut
          Set-Service -Name Audiosrv -StartupType Automatic
          Start-Service -Name Audiosrv
          
          # 3. Create a Specific "Export" Folder on Desktop
          New-Item -ItemType Directory -Force -Path "C:\Users\RDP\Desktop\Final_Exports"
          
          echo "Windows Optimized for Editing!"

      - name: 🎬 Install CapCut & Tools
        run: |
          # Installing Browsers & Tools
          choco install googlechrome -y
          choco install winrar -y
          choco install internet-download-manager -y
          
          # Installing CapCut & FFmpeg (Helper for video)
          choco install capcut -y
          choco install ffmpeg -y
          
          echo "CapCut & Tools Installed Successfully!"

      - name: 🌐 Configure RDP Network & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

      - name: 🔐 Create Secure User
        run: |
          $charSet = @{ Upper = [char[]](65..90); Lower = [char[]](97..122); Number = [char[]](48..57) }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: 🦎 Install & Connect Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "`"$env:TEMP\tailscale.msi`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=Editor-PC-$env:GITHUB_RUN_ID --accept-routes

      - name: ✅ SHOW DETAILS
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: 🟢 KEEP ALIVE
        run: |
          Write-Host "`n==================================================="
          Write-Host "     🎬 CAPCUT RDP IS READY! 🎬"
          Write-Host "==================================================="
          Write-Host "IP Address : $env:TAILSCALE_IP"
          Write-Host "Username   : RDP"
          Write-Host "Password   : $(echo $env:RDP_CREDS)"
          Write-Host "===================================================`n"
          $i = 0
          while ($i -lt 21600) { Start-Sleep -Seconds 10; $i += 10 }
